[package]
name = "translate_plugin"
version = "0.0.3"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP 客户端 - 用于翻译 API
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }

# 加密
md5 = "0.7"

# 日志
log = "0.4.29"
env_logger = "0.10"

# 时间处理
chrono = { version = "0.4", features = ["clock"] }

# 系统目录
dirs = "5.0"

[profile.release]
opt-level = 3
lto = true
