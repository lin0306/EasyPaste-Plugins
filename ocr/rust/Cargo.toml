[package]
name = "ocr_plugin"
version = "0.0.1"
edition = "2021"

[dependencies]
tauri =  "=2.7.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# OCR依赖
windows = { version = "0.58", features = [
    "Graphics_Imaging",
    "Storage_Streams",
    "Media_Ocr",
    "Globalization",
    "Foundation_Collections",
] }
# 日志
log = "0.4.29"
env_logger = "0.10"
# 时间处理
chrono = { version = "0.4", features = ["clock"] }