[package]
name = "ocr_plugin"
version = "0.0.4"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
# 图像处理
image = "0.25"
# 日志
log = "0.4.29"
env_logger = "0.10"
# 时间处理
chrono = { version = "0.4", features = ["clock"] }
# 系统目录
dirs = "5.0"
# OCR
ocr-rs = "2.2.2"

[profile.release]
opt-level = 3
lto = true
